import 'dart:io';
import 'dart:async';

class GnProtocol {
  static const String defaultIp = '192.168.8.100';
  static const int port = 20000; // البورت لي درتو انت
  Socket? _socket;
  int? connectedPort;

  Future<bool> connect({String? ip}) async {
    try {
      final targetIp = ip ?? defaultIp;
      print('محاولة الاتصال $targetIp:$port');
      _socket = await Socket.connect(targetIp, port, timeout: Duration(seconds: 3));
      connectedPort = port;
      
      // بعث Bind Code تاعك
      String bindCode = '210503352505';
      _socket!.write('AUTH:$bindCode\n');
      await _socket!.flush();
      
      return true;
    } catch (e) {
      print('فشل: $e');
      return false;
    }
  }

  void sendKey(String key) {
    try {
      _socket?.write('KEY:$key\r\n');
      print('إرسال: $key');
    } catch(e){
      print('خطأ إرسال: $e');
    }
  }

  void disconnect() {
    _socket?.close();
    _socket = null;
  }
}
